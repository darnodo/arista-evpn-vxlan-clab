      enabled: true
      lacp_mode: active
    - device: ["leaf7"]
      name: Port-Channel999
      description: MLAG Peer
      enabled: true
      lacp_mode: active
    - device: ["leaf8"]
      name: Port-Channel999
      description: MLAG Peer
      enabled: true
      lacp_mode: active
    # Port-Channel1 — Host-facing MLAG LAG (all leafs)
    - device: ["leaf1"]
      name: Port-Channel1
      description: host1
      enabled: true
      lacp_mode: active
      mlag_id: 1
    - device: ["leaf2"]
      name: Port-Channel1
      description: host1
      enabled: true
      lacp_mode: active
      mlag_id: 1
    - device: ["leaf3"]
