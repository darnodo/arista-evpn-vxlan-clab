apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: InfraInterfaceLag
  data:
    # Port-Channel999 — MLAG peer-link (all leafs)
    - device: ["leaf1"]
      name: Port-Channel999
      description: MLAG Peer
      enabled: true
      lacp_mode: active
    - device: ["leaf2"]
      name: Port-Channel999
      description: MLAG Peer
      enabled: true
      lacp_mode: active
    - device: ["leaf3"]
      name: Port-Channel999
      description: MLAG Peer
      enabled: true
      lacp_mode: active
    - device: ["leaf4"]
      name: Port-Channel999
      description: MLAG Peer
      enabled: true
      lacp_mode: active
