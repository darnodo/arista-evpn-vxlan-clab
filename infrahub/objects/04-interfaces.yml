      mlag_id: 1
    - device: ["leaf5"]
      name: Port-Channel1
      description: host3
      enabled: true
      lacp_mode: active
      mlag_id: 1
    - device: ["leaf6"]
      name: Port-Channel1
      description: host3
      enabled: true
      lacp_mode: active
      mlag_id: 1
    - device: ["leaf7"]
      name: Port-Channel1
      description: host4
      enabled: true
      lacp_mode: active
      mlag_id: 1
    - device: ["leaf8"]
      name: Port-Channel1
      description: host4
      enabled: true
      lacp_mode: active
