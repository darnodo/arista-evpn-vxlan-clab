# Interfaces: Loopback, Ethernet, LAG (Port-Channel), VLAN SVIs
# Depends on: 02-devices
---
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: InfraInterfaceLoopback
  data:
    # Spine loopbacks (Lo0 only)
    - device: ["spine1"]
      name: Loopback0
      description: Router-ID
      enabled: true
      ip_addresses:
        - "10.0.250.1/32"
    - device: ["spine2"]
      name: Loopback0
      description: Router-ID
      enabled: true
      ip_addresses:
        - "10.0.250.2/32"
    # Leaf loopbacks (Lo0 + Lo1)
    - device: ["leaf1"]
      name: Loopback0
      description: Router-ID
      enabled: true
      ip_addresses:
        - "10.0.250.11/32"
    - device: ["leaf1"]
      name: Loopback1
      description: VTEP
      enabled: true
      ip_addresses:
        - "10.0.255.11/32"
