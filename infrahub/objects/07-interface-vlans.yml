# VLAN SVI interfaces
# Depends on: 03-devices, 06-vlans-vxlan (VLANs must exist)
---
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: InfraInterfaceVlan
  data:
    # Vlan4090 — MLAG Peer-Link SVI (all leafs)
    - device: ["leaf1"]
      name: Vlan4090
      description: MLAG Peer-Link
      enabled: true
      autostate: false
      vlan: ["4090"]
    - device: ["leaf2"]
      name: Vlan4090
      description: MLAG Peer-Link
      enabled: true
      autostate: false
      vlan: ["4090"]
    - device: ["leaf3"]
      name: Vlan4090
      description: MLAG Peer-Link
      enabled: true
      autostate: false
      vlan: ["4090"]
    - device: ["leaf4"]
      name: Vlan4090
      description: MLAG Peer-Link
      enabled: true
      autostate: false
      vlan: ["4090"]
    - device: ["leaf5"]
      name: Vlan4090
      description: MLAG Peer-Link
      enabled: true
      autostate: false
      vlan: ["4090"]
    - device: ["leaf6"]
      name: Vlan4090
      description: MLAG Peer-Link
      enabled: true
      autostate: false
      vlan: ["4090"]
    - device: ["leaf7"]
      name: Vlan4090
      description: MLAG Peer-Link
      enabled: true
      autostate: false
      vlan: ["4090"]
    - device: ["leaf8"]
      name: Vlan4090
      description: MLAG Peer-Link
      enabled: true
      autostate: false
      vlan: ["4090"]
    # Vlan4091 — MLAG iBGP Peering SVI (all leafs)
    - device: ["leaf1"]
      name: Vlan4091
      description: MLAG iBGP Peering
      enabled: true
      mtu: 9214
      vlan: ["4091"]
    - device: ["leaf2"]
      name: Vlan4091
      description: MLAG iBGP Peering
      enabled: true
      mtu: 9214
      vlan: ["4091"]
    - device: ["leaf3"]
      name: Vlan4091
      description: MLAG iBGP Peering
      enabled: true
      mtu: 9214
      vlan: ["4091"]
    - device: ["leaf4"]
      name: Vlan4091
      description: MLAG iBGP Peering
      enabled: true
      mtu: 9214
      vlan: ["4091"]
    - device: ["leaf5"]
      name: Vlan4091
      description: MLAG iBGP Peering
      enabled: true
      mtu: 9214
      vlan: ["4091"]
    - device: ["leaf6"]
      name: Vlan4091
      description: MLAG iBGP Peering
      enabled: true
      mtu: 9214
      vlan: ["4091"]
    - device: ["leaf7"]
      name: Vlan4091
      description: MLAG iBGP Peering
      enabled: true
      mtu: 9214
      vlan: ["4091"]
    - device: ["leaf8"]
      name: Vlan4091
      description: MLAG iBGP Peering
      enabled: true
      mtu: 9214
      vlan: ["4091"]
    # Vlan34 — VRF gold subnet (leaf3/leaf4)
    - device: ["leaf3"]
      name: Vlan34
      description: VRF gold subnet
      enabled: true
      virtual_router_address: "10.34.34.1"
      vlan: ["34"]
    - device: ["leaf4"]
      name: Vlan34
      description: VRF gold subnet
      enabled: true
      virtual_router_address: "10.34.34.1"
      vlan: ["34"]
    # Vlan78 — VRF gold subnet (leaf7/leaf8)
    - device: ["leaf7"]
      name: Vlan78
      description: VRF gold subnet
      enabled: true
      virtual_router_address: "10.78.78.1"
      vlan: ["78"]
    - device: ["leaf8"]
      name: Vlan78
      description: VRF gold subnet
      enabled: true
      virtual_router_address: "10.78.78.1"
      vlan: ["78"]
    # Vlan900 — BGP border peering (leaf7/leaf8)
    - device: ["leaf7"]
      name: Vlan900
      description: BGP border peering
      enabled: true
      vlan: ["900"]
    - device: ["leaf8"]
      name: Vlan900
