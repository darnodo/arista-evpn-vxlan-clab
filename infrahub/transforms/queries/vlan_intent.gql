query VlanIntent($device_name: String!) {
  # VLANs reachable via VTEP VLAN-VNI mappings (L2/VXLAN VLANs)
  InfraVTEP(device__name__value: $device_name) {
    edges {
      node {
        source_address {
          value
        }
        udp_port {
          value
        }
        vlan_vni_mappings {
          edges {
            node {
              vlan {
                node {
                  vlan_id {
                    value
                  }
                  name {
                    value
                  }
                  status {
                    value
                  }
                  vlan_type {
                    value
                  }
                  trunk_groups {
                    value
                  }
                  stp_enabled {
                    value
                  }
                  vni {
                    node {
                      vni {
                        value
                      }
                      vni_type {
                        value
                      }
                    }
                  }
                }
              }
            }
          }
        }
      }
    }
  }
  # VLANs reachable via SVI interfaces (MLAG, routing, and other local VLANs)
  InfraInterfaceVlan(device__name__value: $device_name) {
    edges {
      node {
        vlan {
          node {
            vlan_id {
              value
            }
            name {
              value
            }
            status {
              value
            }
            vlan_type {
              value
            }
            trunk_groups {
              value
            }
            stp_enabled {
              value
            }
            vni {
              node {
                vni {
                  value
                }
                vni_type {
                  value
                }
              }
            }
          }
        }
      }
    }
  }
}
