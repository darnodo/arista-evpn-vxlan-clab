query BgpIntent($device_name: String!) {
  InfraBGPRouterConfig(device__name__value: $device_name) {
    edges {
      node {
        router_id { value }
        default_ipv4_unicast { value }
        log_neighbor_changes { value }
        ecmp_max_paths { value }
        ecmp_max_ecmp { value }
        ebgp_distance { value }
        ibgp_distance { value }
        local_distance { value }
        local_asn {
          node {
            asn { value }
          }
        }
        peer_groups {
          edges {
            node {
              name { value }
              peer_group_type { value }
              update_source { value }
              ebgp_multihop { value }
              send_community { value }
              next_hop_self { value }
              next_hop_unchanged { value }
              maximum_routes { value }
              maximum_routes_warning_only { value }
              remote_asn {
                node {
                  asn { value }
                }
              }
            }
          }
        }
        sessions {
          edges {
            node {
              peer_address { value }
              description { value }
              enabled { value }
              peer_group {
                node {
                  name { value }
                  local_identifier { value }
                }
              }
              remote_asn {
                node {
                  asn { value }
                }
              }
              vrf {
                node {
                  name { value }
                }
              }
              peer_device {
                node {
                  name { value }
                }
              }
            }
          }
        }
      }
    }
  }
  InfraBGPAddressFamily(bgp_config__device__name__value: $device_name) {
    edges {
      node {
        afi { value }
        safi { value }
        vrf {
          node {
            name { value }
          }
        }
        active_peer_groups {
          edges {
            node {
              name { value }
            }
          }
        }
        active_sessions {
          edges {
            node {
              peer_address { value }
            }
          }
        }
        networks {
          edges {
            node {
              address { value }
            }
          }
        }
      }
    }
  }
}
