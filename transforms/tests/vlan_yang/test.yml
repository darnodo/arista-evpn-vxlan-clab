---
version: "1.0"
infrahub_tests:
  - resource: Jinja2Transform
    resource_name: vlan_yang_transform
    tests:
      - name: smoke_check
        spec:
          kind: jinja2-transform-smoke
      - name: render_leaf1
        spec:
          kind: jinja2-transform-unit-render
          directory: transforms/tests/vlan_yang
          input: input.json
          output: output.json
