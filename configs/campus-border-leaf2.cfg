! Campus-Border-Leaf2 Configuration
! Campus Border Leaf - AS 66005 (MLAG pair with campus-border-leaf1)
! Provides egress from Campus EVPN-VXLAN fabric to Core L3 network
!
hostname campus-border-leaf2
!
! LLDP Management0
lldp management-address Management0
!
! enable gNMI API
management api gnmi
   transport grpc default
   provider eos-native
!
! SNMPv3 read-only (shared lab credentials, see docs/observability/snmp.md)
snmp-server engineID local 8000757101ac100017
snmp-server view all iso included
snmp-server group lab-ro v3 priv read all
snmp-server user snmp-ro lab-ro v3 auth sha256 evpnlab-auth priv aes evpnlab-priv
!
! Management plane (shared lab values, see docs/observability/management-plane.md)
!
! SNMPv2c communities (ro + rw), each restricted by a standard ACL
ip access-list standard SNMP-RO
   10 permit 172.16.0.0/24
!
ip access-list standard SNMP-RW
   10 permit host 172.16.0.254
!
snmp-server community evpnlab-ro ro SNMP-RO
snmp-server community evpnlab-rw rw SNMP-RW
!
! SNMPv3 second user, authNoPriv
snmp-server group lab-auth v3 auth read all
snmp-server user snmp-auth lab-auth v3 auth sha256 evpnlab-authonly
!
! Local users: read-only operator and automation account with SSH key
! (local accounts are only used when no TACACS+ server answers)
username netops privilege 1 role network-operator secret evpnlab-netops
username automation privilege 15 role network-admin secret evpnlab-automation
username automation ssh-key ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIGKPrCfwB3e2uplnqP1MyN6YNp5Yu/apoAKAZUgKiOfe automation@evpn-lab
!
! TACACS+ for device administration: active server first, dead IP second
tacacs-server timeout 2
tacacs-server host 172.16.0.75 key 0 evpnlab-tacacs
tacacs-server host 172.16.0.99 key 0 evpnlab-tacacs
!
aaa group server tacacs+ LAB-TACACS
   server 172.16.0.75
   server 172.16.0.99
!
ip tacacs source-interface Management0
!
aaa authentication login default group LAB-TACACS local
aaa authentication login console local
aaa authentication enable default group LAB-TACACS local
aaa authorization exec default group LAB-TACACS local
aaa authorization commands all default group LAB-TACACS local
aaa accounting exec default start-stop group LAB-TACACS
aaa accounting commands all default start-stop group LAB-TACACS
!
! Management APIs: eAPI and NETCONF on, telnet explicitly off (gNMI above)
management api http-commands
   no shutdown
!
management api netconf
   transport ssh default
!
management telnet
   shutdown
!
! NTP (config only, no NTP server in the lab)
ntp server 172.16.0.254 prefer
ntp server 172.16.0.99
!
! Syslog: Alloy (UDP 514, RFC5424), dead IP on a non-default port
logging trap informational
logging format rfc5424
logging host 172.16.0.73
logging host 172.16.0.99 1514
!
! DNS: CoreDNS, dead IP second
ip name-server vrf default 172.16.0.77
ip name-server vrf default 172.16.0.99
dns domain evpnlab.local
!
! admin/admin for ssh access
username admin privilege 15 role network-admin secret sha512 $6$xQktFrbdeqEhVzLM$.1wOJB25nw2fqYaSXDu6y4mo6AP9hngMCFe2vGDl84hWoz00Q.4unoEBqspNI0HEoRz.OZhdBHqQv12KABf0B0
!
! Enable IP routing
ip routing
!
! Enable routing protocols
service routing protocols model multi-agent
!
! VRF Definition
vrf instance gold
!
! VLANs
vlan 4090
   name mlag-peer
   trunk group mlag-peer
!
vlan 4091
   name mlag-ibgp
   trunk group mlag-peer
!
! Management interface
interface Management0
   ip address 172.16.0.23/24
!
! MLAG Peer-link SVI
interface Vlan4090
   description MLAG Peer-Link
   ip address 10.1.199.255/31
   no autostate
!
! iBGP Peering SVI
interface Vlan4091
   description MLAG iBGP Peering
   ip address 10.1.3.5/31
   mtu 9214
!
! Loopbacks
interface Loopback0
   description Router-ID
   ip address 10.1.250.22/32
!
interface Loopback1
   description VTEP
   ip address 10.1.255.21/32
!
interface Loopback2
   description VRF-Gold-health
   vrf gold
   ip address 10.1.250.222/32
!
! MLAG Peer-link
interface Ethernet10
   description mlag peer link
   channel-group 999 mode active
!
interface Port-Channel999
   description MLAG Peer
   switchport mode trunk
   switchport trunk group mlag-peer
   spanning-tree link-type point-to-point
!
! Underlay P2P interfaces to Campus Spines
interface Ethernet11
   description campus-spine1
   no switchport
   ip address 10.1.1.11/31
   mtu 9214
!
interface Ethernet12
   description campus-spine2
   no switchport
   ip address 10.1.2.11/31
   mtu 9214
!
! Uplink to Core1 (subinterfaced: .100 default VRF, .200 VRF gold)
interface Ethernet13
   description core1
   no switchport
   mtu 9214
!
interface Ethernet13.100
   description core1-underlay
   encapsulation dot1q vlan 100
   ip address 10.0.5.3/31
   mtu 9214
!
interface Ethernet13.200
   description core1-vrf-gold
   encapsulation dot1q vlan 200
   vrf gold
   ip address 10.0.15.3/31
   mtu 9214
!
! Uplink to Core2
interface Ethernet14
   description core2
   no switchport
   mtu 9214
!
interface Ethernet14.100
   description core2-underlay
   encapsulation dot1q vlan 100
   ip address 10.0.5.7/31
   mtu 9214
!
interface Ethernet14.200
   description core2-vrf-gold
   encapsulation dot1q vlan 200
   vrf gold
   ip address 10.0.15.7/31
   mtu 9214
!
! Spanning-tree
no spanning-tree vlan 4090
no spanning-tree vlan 4091
!
! Virtual MAC for Anycast Gateway
ip virtual-router mac-address c001.cafe.babe
!
! MLAG Configuration
mlag configuration
   domain-id border-leafs-campus
   local-interface Vlan4090
   peer-address 10.1.199.254
   peer-link Port-Channel999
   dual-primary detection delay 10 action errdisable all-interfaces
   peer-address heartbeat 172.16.0.22 vrf mgmt
!
! VXLAN Interface
interface Vxlan1
   vxlan source-interface Loopback1
   vxlan udp-port 4789
   vxlan learn-restrict any
   vxlan vrf gold vni 100001
!
! IP Routing
ip routing
ip routing vrf gold
ip route 100.64.0.0/10 172.16.0.254
!
! VRF gold: scope redistribute connected to the Loopback2 health address only.
! Loopback2 is kept on purpose - it's the only source address available to
! ping inside VRF gold from this transit device. The .200 transit /31s are
! intentionally excluded.
ip prefix-list PL-GOLD-HEALTH-LOOPBACK
   seq 10 permit 10.1.250.222/32
!
route-map RM-GOLD-CONNECTED permit 10
   match ip address prefix-list PL-GOLD-HEALTH-LOOPBACK
!
! BGP Configuration
router bgp 66005
   router-id 10.1.250.22
   no bgp default ipv4-unicast
   bgp log-neighbor-changes
   distance bgp 20 200 200
   maximum-paths 4 ecmp 64
   !
   ! Underlay peer-group (to Campus spines)
   neighbor underlay peer group
   neighbor underlay remote-as 66000
   neighbor underlay maximum-routes 12000 warning-only
   neighbor 10.1.1.10 peer group underlay
   neighbor 10.1.2.10 peer group underlay
   !
   ! iBGP peer-group (to MLAG peer)
   neighbor underlay_ibgp peer group
   neighbor underlay_ibgp remote-as 66005
   neighbor underlay_ibgp maximum-routes 12000 warning-only
   neighbor underlay_ibgp next-hop-self
   neighbor 10.1.3.4 peer group underlay_ibgp
   !
   ! EVPN peer-group (to Campus spines)
   neighbor evpn peer group
   neighbor evpn remote-as 66000
   neighbor evpn update-source Loopback0
   neighbor evpn ebgp-multihop 3
   neighbor evpn send-community extended
   neighbor evpn maximum-routes 12000 warning-only
   neighbor 10.1.250.1 peer group evpn
   neighbor 10.1.250.2 peer group evpn
   !
   ! eBGP to Core routers (default VRF)
   neighbor core peer group
   neighbor core remote-as 65500
   neighbor core send-community extended
   neighbor core maximum-routes 12000 warning-only
   neighbor 10.0.5.2 peer group core
   neighbor 10.0.5.6 peer group core
   !
   ! IPv4 address family
   address-family ipv4
      neighbor underlay activate
      neighbor underlay_ibgp activate
      neighbor core activate
      network 10.1.250.22/32
      network 10.1.255.21/32
   !
   ! EVPN address family
   address-family evpn
      neighbor evpn activate
   !
   ! VRF Gold configuration
   vrf gold
      rd 10.1.250.22:1
      route-target import evpn 1:100001
      route-target export evpn 1:100001
      router-id 10.1.250.22
      neighbor 10.0.15.2 remote-as 65500
      neighbor 10.0.15.2 send-community extended
      neighbor 10.0.15.2 maximum-routes 12000 warning-only
      neighbor 10.0.15.6 remote-as 65500
      neighbor 10.0.15.6 send-community extended
      neighbor 10.0.15.6 maximum-routes 12000 warning-only
      !
      address-family ipv4
         neighbor 10.0.15.2 activate
         neighbor 10.0.15.6 activate
      !
      redistribute connected route-map RM-GOLD-CONNECTED
!
end
