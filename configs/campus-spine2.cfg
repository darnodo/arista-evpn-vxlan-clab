! Campus-Spine2 Configuration
! Campus BGP EVPN Spine - AS 66000
!
hostname campus-spine2
!
! LLDP Management0
lldp management-address Management0
!
! enable gNMI API
management api gnmi
   transport grpc default
   provider eos-native
!
! SNMPv3 read-only (shared lab credentials, see docs/observability/snmp.md)
snmp-server engineID local 8000757101ac100015
snmp-server view all iso included
snmp-server group lab-ro v3 priv read all
snmp-server user snmp-ro lab-ro v3 auth sha256 evpnlab-auth priv aes evpnlab-priv
!
! Management plane (shared lab values, see docs/observability/management-plane.md)
!
! SNMPv2c communities (ro + rw), each restricted by a standard ACL
ip access-list standard SNMP-RO
   10 permit 172.16.0.0/24
!
ip access-list standard SNMP-RW
   10 permit host 172.16.0.254
!
snmp-server community evpnlab-ro ro SNMP-RO
snmp-server community evpnlab-rw rw SNMP-RW
!
! SNMPv3 second user, authNoPriv
snmp-server group lab-auth v3 auth read all
snmp-server user snmp-auth lab-auth v3 auth sha256 evpnlab-authonly
!
! Local users: read-only operator and automation account with SSH key
! (local accounts are only used when no TACACS+ server answers)
username netops privilege 1 role network-operator secret evpnlab-netops
username automation privilege 15 role network-admin secret evpnlab-automation
username automation ssh-key ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIGKPrCfwB3e2uplnqP1MyN6YNp5Yu/apoAKAZUgKiOfe automation@evpn-lab
!
! TACACS+ for device administration: active server first, dead IP second
tacacs-server timeout 2
tacacs-server host 172.16.0.75 key 0 evpnlab-tacacs
tacacs-server host 172.16.0.99 key 0 evpnlab-tacacs
!
aaa group server tacacs+ LAB-TACACS
   server 172.16.0.75
   server 172.16.0.99
!
ip tacacs source-interface Management0
!
aaa authentication login default group LAB-TACACS local
aaa authentication login console local
aaa authentication enable default group LAB-TACACS local
aaa authorization exec default group LAB-TACACS local
aaa authorization commands all default group LAB-TACACS local
aaa accounting exec default start-stop group LAB-TACACS
aaa accounting commands all default start-stop group LAB-TACACS
!
! Management APIs: eAPI and NETCONF on, telnet explicitly off (gNMI above)
management api http-commands
   no shutdown
!
management api netconf
   transport ssh default
!
management telnet
   shutdown
!
! NTP (config only, no NTP server in the lab)
ntp server 172.16.0.254 prefer
ntp server 172.16.0.99
!
! Syslog: Alloy (UDP 514, RFC5424), dead IP on a non-default port
logging trap informational
logging format rfc5424
logging host 172.16.0.73
logging host 172.16.0.99 1514
!
! DNS: CoreDNS, dead IP second
ip name-server vrf default 172.16.0.77
ip name-server vrf default 172.16.0.99
dns domain evpnlab.local
!
! admin/admin for ssh access
username admin privilege 15 role network-admin secret sha512 $6$xQktFrbdeqEhVzLM$.1wOJB25nw2fqYaSXDu6y4mo6AP9hngMCFe2vGDl84hWoz00Q.4unoEBqspNI0HEoRz.OZhdBHqQv12KABf0B0
!
! Enable IP routing
ip routing
ip route 100.64.0.0/10 172.16.0.254
!
! Enable routing protocols
service routing protocols model multi-agent
!
! Management interface
interface Management0
   ip address 172.16.0.21/24
!
! Loopback for BGP Router-ID
interface Loopback0
   ip address 10.1.250.2/32
!
! Underlay P2P interfaces to Campus Leafs
interface Ethernet1
   description campus-leaf1
   no switchport
   ip address 10.1.2.0/31
   mtu 9214
!
interface Ethernet2
   description campus-leaf2
   no switchport
   ip address 10.1.2.2/31
   mtu 9214
!
interface Ethernet3
   description campus-leaf3
   no switchport
   ip address 10.1.2.4/31
   mtu 9214
!
interface Ethernet4
   description campus-leaf4
   no switchport
   ip address 10.1.2.6/31
   mtu 9214
!
! Underlay P2P interfaces to Campus Border Leafs
interface Ethernet5
   description campus-border-leaf1
   no switchport
   ip address 10.1.2.8/31
   mtu 9214
!
interface Ethernet6
   description campus-border-leaf2
   no switchport
   ip address 10.1.2.10/31
   mtu 9214
!
! BGP Configuration
router bgp 66000
   router-id 10.1.250.2
   no bgp default ipv4-unicast
   bgp log-neighbor-changes
   distance bgp 20 200 200
   maximum-paths 4 ecmp 64
   !
   ! Underlay IPv4 neighbors
   neighbor 10.1.2.1 remote-as 66001
   neighbor 10.1.2.3 remote-as 66001
   neighbor 10.1.2.5 remote-as 66002
   neighbor 10.1.2.7 remote-as 66002
   neighbor 10.1.2.9 remote-as 66005
   neighbor 10.1.2.11 remote-as 66005
   !
   ! EVPN peer-group configuration
   neighbor evpn peer group
   neighbor evpn next-hop-unchanged
   neighbor evpn update-source Loopback0
   neighbor evpn ebgp-multihop 3
   neighbor evpn send-community extended
   neighbor evpn maximum-routes 12000 warning-only
   !
   ! EVPN neighbors (to campus leaf loopbacks)
   neighbor 10.1.250.11 peer group evpn
   neighbor 10.1.250.11 remote-as 66001
   neighbor 10.1.250.12 peer group evpn
   neighbor 10.1.250.12 remote-as 66001
   neighbor 10.1.250.13 peer group evpn
   neighbor 10.1.250.13 remote-as 66002
   neighbor 10.1.250.14 peer group evpn
   neighbor 10.1.250.14 remote-as 66002
   !
   ! EVPN neighbors (to campus border-leaf loopbacks)
   neighbor 10.1.250.21 peer group evpn
   neighbor 10.1.250.21 remote-as 66005
   neighbor 10.1.250.22 peer group evpn
   neighbor 10.1.250.22 remote-as 66005
   !
   ! IPv4 address family
   address-family ipv4
      neighbor 10.1.2.1 activate
      neighbor 10.1.2.3 activate
      neighbor 10.1.2.5 activate
      neighbor 10.1.2.7 activate
      neighbor 10.1.2.9 activate
      neighbor 10.1.2.11 activate
      network 10.1.250.2/32
   !
   ! EVPN address family
   address-family evpn
      neighbor evpn activate
!
end
