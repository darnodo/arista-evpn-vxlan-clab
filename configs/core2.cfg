! Core2 Configuration
! Core Router - AS 65500
! Transit between DC Border Leafs and Campus Border Leafs
!
hostname core2
!
! LLDP Management0
lldp management-address Management0
!
! enable gNMI API
management api gnmi
   transport grpc default
   provider eos-native
!
! SNMPv3 read-only (shared lab credentials, see docs/observability/snmp.md)
snmp-server engineID local 8000757101ac10000b
snmp-server view all iso included
snmp-server group lab-ro v3 priv read all
snmp-server user snmp-ro lab-ro v3 auth sha256 evpnlab-auth priv aes evpnlab-priv
!
! Management plane (shared lab values, see docs/observability/management-plane.md)
!
! SNMPv2c communities (ro + rw), each restricted by a standard ACL
ip access-list standard SNMP-RO
   10 permit 172.16.0.0/24
!
ip access-list standard SNMP-RW
   10 permit host 172.16.0.254
!
snmp-server community evpnlab-ro ro SNMP-RO
snmp-server community evpnlab-rw rw SNMP-RW
!
! SNMPv3 second user, authNoPriv
snmp-server group lab-auth v3 auth read all
snmp-server user snmp-auth lab-auth v3 auth sha256 evpnlab-authonly
!
! Local users: read-only operator and automation account with SSH key
! (local accounts are only used when no TACACS+ server answers)
username netops privilege 1 role network-operator secret evpnlab-netops
username automation privilege 15 role network-admin secret evpnlab-automation
username automation ssh-key ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIGKPrCfwB3e2uplnqP1MyN6YNp5Yu/apoAKAZUgKiOfe automation@evpn-lab
!
! TACACS+ for device administration: active server first, dead IP second
tacacs-server timeout 2
tacacs-server host 172.16.0.75 key 0 evpnlab-tacacs
tacacs-server host 172.16.0.99 key 0 evpnlab-tacacs
!
aaa group server tacacs+ LAB-TACACS
   server 172.16.0.75
   server 172.16.0.99
!
ip tacacs source-interface Management0
!
aaa authentication login default group LAB-TACACS local
aaa authentication login console local
aaa authentication enable default group LAB-TACACS local
aaa authorization exec default group LAB-TACACS local
aaa authorization commands all default group LAB-TACACS local
aaa accounting exec default start-stop group LAB-TACACS
aaa accounting commands all default start-stop group LAB-TACACS
!
! Management APIs: eAPI and NETCONF on, telnet explicitly off (gNMI above)
management api http-commands
   no shutdown
!
management api netconf
   transport ssh default
!
management telnet
   shutdown
!
! NTP (config only, no NTP server in the lab)
ntp server 172.16.0.254 prefer
ntp server 172.16.0.99
!
! Syslog: Alloy (UDP 514, RFC5424), dead IP on a non-default port
logging trap informational
logging format rfc5424
logging host 172.16.0.73
logging host 172.16.0.99 1514
!
! DNS: CoreDNS, dead IP second
ip name-server vrf default 172.16.0.77
ip name-server vrf default 172.16.0.99
dns domain evpnlab.local
!
! admin/admin for ssh access
username admin privilege 15 role network-admin secret sha512 $6$xQktFrbdeqEhVzLM$.1wOJB25nw2fqYaSXDu6y4mo6AP9hngMCFe2vGDl84hWoz00Q.4unoEBqspNI0HEoRz.OZhdBHqQv12KABf0B0
!
! Enable IP routing
ip routing
!
! Enable routing protocols
service routing protocols model multi-agent
!
! VRF Definition
vrf instance gold
!
! Management interface
interface Management0
   ip address 172.16.0.11/24
!
! Loopback for BGP Router-ID (default VRF)
interface Loopback0
   description Router-ID
   ip address 10.0.200.2/32
!
! Loopback in VRF Gold (router-id and health)
interface Loopback1
   description VRF-Gold-RouterID
   vrf gold
   ip address 10.0.200.102/32
!
! Link to DC Border Leaf 1
interface Ethernet1
   description dc-border-leaf1
   no switchport
   mtu 9214
!
interface Ethernet1.100
   description dc-border-leaf1-underlay
   encapsulation dot1q vlan 100
   ip address 10.0.4.4/31
   mtu 9214
!
interface Ethernet1.200
   description dc-border-leaf1-vrf-gold
   encapsulation dot1q vlan 200
   vrf gold
   ip address 10.0.14.4/31
   mtu 9214
!
! Link to DC Border Leaf 2
interface Ethernet2
   description dc-border-leaf2
   no switchport
   mtu 9214
!
interface Ethernet2.100
   description dc-border-leaf2-underlay
   encapsulation dot1q vlan 100
   ip address 10.0.4.6/31
   mtu 9214
!
interface Ethernet2.200
   description dc-border-leaf2-vrf-gold
   encapsulation dot1q vlan 200
   vrf gold
   ip address 10.0.14.6/31
   mtu 9214
!
! Link to Campus Border Leaf 1
interface Ethernet3
   description campus-border-leaf1
   no switchport
   mtu 9214
!
interface Ethernet3.100
   description campus-border-leaf1-underlay
   encapsulation dot1q vlan 100
   ip address 10.0.5.4/31
   mtu 9214
!
interface Ethernet3.200
   description campus-border-leaf1-vrf-gold
   encapsulation dot1q vlan 200
   vrf gold
   ip address 10.0.15.4/31
   mtu 9214
!
! Link to Campus Border Leaf 2
interface Ethernet4
   description campus-border-leaf2
   no switchport
   mtu 9214
!
interface Ethernet4.100
   description campus-border-leaf2-underlay
   encapsulation dot1q vlan 100
   ip address 10.0.5.6/31
   mtu 9214
!
interface Ethernet4.200
   description campus-border-leaf2-vrf-gold
   encapsulation dot1q vlan 200
   vrf gold
   ip address 10.0.15.6/31
   mtu 9214
!
! Inter-Core link
interface Ethernet5
   description core1
   no switchport
   mtu 9214
!
interface Ethernet5.100
   description core1-underlay
   encapsulation dot1q vlan 100
   ip address 10.0.200.129/31
   mtu 9214
!
interface Ethernet5.200
   description core1-vrf-gold
   encapsulation dot1q vlan 200
   vrf gold
   ip address 10.0.200.131/31
   mtu 9214
!
! IP Routing
ip routing
ip routing vrf gold
ip route 100.64.0.0/10 172.16.0.254
!
! OSPF for inter-core loopback reachability only (default VRF)
router ospf 1
   router-id 10.0.200.2
   passive-interface default
   no passive-interface Ethernet5.100
   network 10.0.200.2/32 area 0
   network 10.0.200.128/31 area 0
   max-lsa 12000
!
! Route filtering for eBGP sessions to border leafs (default VRF)
! Only border leaf Loopback0 /32s cross the core; core loopbacks are the
! only prefixes advertised back. VTEP loopbacks and underlay /31s stay local.
ip prefix-list PL-DC-BL-LOOPBACKS
   seq 10 permit 10.0.250.21/32
   seq 20 permit 10.0.250.22/32
!
ip prefix-list PL-CAMPUS-BL-LOOPBACKS
   seq 10 permit 10.1.250.21/32
   seq 20 permit 10.1.250.22/32
!
ip prefix-list PL-CORE-LOOPBACKS
   seq 10 permit 10.0.200.1/32
   seq 20 permit 10.0.200.2/32
!
route-map RM-FROM-DC-BL-IN permit 10
   match ip address prefix-list PL-DC-BL-LOOPBACKS
!
route-map RM-FROM-CAMPUS-BL-IN permit 10
   match ip address prefix-list PL-CAMPUS-BL-LOOPBACKS
!
route-map RM-TO-BL-OUT permit 10
   match ip address prefix-list PL-CORE-LOOPBACKS
!
! VRF gold: scope redistribute connected to the Loopback1 health address only.
! Loopback1 is kept on purpose - it's the only source address available to
! ping inside VRF gold from this transit device. The .200 transit /31s are
! intentionally excluded.
ip prefix-list PL-GOLD-HEALTH-LOOPBACK
   seq 10 permit 10.0.200.102/32
!
route-map RM-GOLD-CONNECTED permit 10
   match ip address prefix-list PL-GOLD-HEALTH-LOOPBACK
!
! BGP Configuration
router bgp 65500
   router-id 10.0.200.2
   no bgp default ipv4-unicast
   bgp log-neighbor-changes
   distance bgp 20 200 200
   maximum-paths 4 ecmp 64
   !
   ! iBGP to core1 (loopback-based, default VRF)
   neighbor core_ibgp peer group
   neighbor core_ibgp remote-as 65500
   neighbor core_ibgp update-source Loopback0
   neighbor core_ibgp next-hop-self
   neighbor core_ibgp send-community extended
   neighbor core_ibgp maximum-routes 12000 warning-only
   neighbor 10.0.200.1 peer group core_ibgp
   !
   ! eBGP to DC Border Leafs (default VRF)
   neighbor dc_bl peer group
   neighbor dc_bl remote-as 65005
   neighbor dc_bl send-community extended
   neighbor dc_bl maximum-routes 12000 warning-only
   neighbor 10.0.4.5 peer group dc_bl
   neighbor 10.0.4.7 peer group dc_bl
   !
   ! eBGP to Campus Border Leafs (default VRF)
   neighbor campus_bl peer group
   neighbor campus_bl remote-as 66005
   neighbor campus_bl send-community extended
   neighbor campus_bl maximum-routes 12000 warning-only
   neighbor 10.0.5.5 peer group campus_bl
   neighbor 10.0.5.7 peer group campus_bl
   !
   ! IPv4 address family (default VRF)
   address-family ipv4
      neighbor core_ibgp activate
      neighbor dc_bl activate
      neighbor dc_bl route-map RM-FROM-DC-BL-IN in
      neighbor dc_bl route-map RM-TO-BL-OUT out
      neighbor campus_bl activate
      neighbor campus_bl route-map RM-FROM-CAMPUS-BL-IN in
      neighbor campus_bl route-map RM-TO-BL-OUT out
      network 10.0.200.2/32
   !
   ! VRF Gold configuration - transit for inter-fabric routing
   vrf gold
      rd 10.0.200.2:100001
      router-id 10.0.200.2
      ! iBGP to core1 in VRF gold (P2P)
      neighbor 10.0.200.130 remote-as 65500
      neighbor 10.0.200.130 next-hop-self
      neighbor 10.0.200.130 send-community extended
      neighbor 10.0.200.130 maximum-routes 12000 warning-only
      ! eBGP to DC Border Leafs in VRF gold
      neighbor 10.0.14.5 remote-as 65005
      neighbor 10.0.14.5 send-community extended
      neighbor 10.0.14.5 maximum-routes 12000 warning-only
      neighbor 10.0.14.7 remote-as 65005
      neighbor 10.0.14.7 send-community extended
      neighbor 10.0.14.7 maximum-routes 12000 warning-only
      ! eBGP to Campus Border Leafs in VRF gold
      neighbor 10.0.15.5 remote-as 66005
      neighbor 10.0.15.5 send-community extended
      neighbor 10.0.15.5 maximum-routes 12000 warning-only
      neighbor 10.0.15.7 remote-as 66005
      neighbor 10.0.15.7 send-community extended
      neighbor 10.0.15.7 maximum-routes 12000 warning-only
      !
      address-family ipv4
         neighbor 10.0.14.5 activate
         neighbor 10.0.14.7 activate
         neighbor 10.0.15.5 activate
         neighbor 10.0.15.7 activate
         neighbor 10.0.200.130 activate
      !
      redistribute connected route-map RM-GOLD-CONNECTED
!
end
