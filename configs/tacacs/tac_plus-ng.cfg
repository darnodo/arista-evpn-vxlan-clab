# tac_plus-ng: TACACS+ for device administration on every cEOS node.
# Shared lab values (evpnlab- prefix), see docs/observability/management-plane.md.

id = spawnd {
	background = no
	listen { port = 49 }
}

id = tac_plus-ng {
	# Syslog to Alloy (RFC3164 over UDP), and container stdout for `docker logs`
	log alloy { destination = 172.16.0.73:1514 }
	log stdout { destination = ">/dev/stdout" }
	access log = alloy
	access log = stdout
	authorization log = alloy
	accounting log = alloy
	accounting log = stdout

	device lab-mgmt {
		address = 172.16.0.0/24
		key = evpnlab-tacacs
	}

	# Full access
	profile admin {
		script {
			if (service == shell) {
				if (cmd == "") set priv-lvl = 15
				permit
			}
		}
	}

	# Read-only: show commands only
	profile operator {
		script {
			if (service == shell) {
				if (cmd == "") { set priv-lvl = 1 permit }
				if (cmd =~ /^show /) permit
				if (cmd =~ /^(exit|logout)/) permit
				deny
			}
		}
	}

	# Every user that logs in over SSH must exist here: EOS falls back to
	# local accounts only when no TACACS+ server answers, not on reject.
	user admin  { password login = clear admin          profile = admin }
	user netops { password login = clear evpnlab-netops profile = operator }
}
